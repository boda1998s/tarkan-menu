<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="منيو تركان - Coffee, Broasted & Sandwich - مول المنصورة">
<title>TARKAN Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: brand-red poster page — sticky category rail, each section a white "T" tab label + item list with the product cutout, like the printed menu */
:root{
  --red:#F2342C; --red-deep:#D4231C; --white:#FFFFFF; --cream:#FFF4EF;
  --ink:#2A0D0B; --shade:rgba(0,0,0,.14);
  --f-display:"Lalezar","Tajawal",system-ui,sans-serif;
  --f-body:"Tajawal",system-ui,sans-serif;
  --f-latin:"Lilita One","Tajawal",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--red);color:var(--white);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}

/* hero */
header.hero{position:relative;overflow:hidden;padding-block:28px 22px}
.hero .wrap{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-width:0}
.brand img.word{width:min(300px,62vw);height:auto}
.tag{font-family:var(--f-latin);letter-spacing:.06em;font-size:clamp(13px,2.6vw,17px);opacity:.95;display:flex;align-items:center;gap:10px}
.tag::before,.tag::after{content:"";height:2px;width:26px;background:var(--white);opacity:.7}
.hero p.loc{margin:0;font-weight:700;font-size:15px;opacity:.92}
.hero-img{width:clamp(140px,32vw,300px);transform:rotate(-6deg)}
.stripe{position:absolute;inset-block:0;inset-inline-end:clamp(150px,36vw,340px);width:14px;background:var(--white);opacity:.95}
@media (max-width:520px){.stripe{display:none}}

/* nav */
nav.cats{position:sticky;will-change:transform;top:env(safe-area-inset-top,0px);z-index:5;background:var(--red);border-block:2px solid var(--white)}
.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.cats a{flex:none;color:var(--white);text-decoration:none;font-family:var(--f-display);font-size:18px;line-height:1;padding:9px 14px 7px;border-radius:999px;border:2px solid rgba(255,255,255,.55);white-space:nowrap;transition:background .15s,color .15s}
.cats a:hover,.cats a.on{background:var(--white);color:var(--red)}
.cats a:focus-visible,.search input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

.search{padding-block:18px 4px}
.search input{width:100%;font:500 16px var(--f-body);color:var(--ink);background:var(--white);border:0;border-radius:14px;padding:13px 16px}
.search input::placeholder{color:#9a5a55}
#empty{text-align:center;font-weight:700;padding-block:30px}

/* sections */
section.cat{padding-block:34px 12px;border-bottom:2px dashed rgba(255,255,255,.35)}
.cat-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.tlabel{position:relative;display:inline-flex;flex-direction:column;align-items:center}
.tlabel .bar{background:var(--white);color:var(--red);font-family:var(--f-latin);font-size:clamp(24px,5vw,34px);line-height:1;padding:12px 22px 10px;border-radius:6px 26px 6px 6px;transform:rotate(-3deg)}
.tlabel .stem{width:38%;height:22px;background:var(--white);border-radius:0 0 10px 12px;transform:rotate(-3deg) translateY(-2px)}
.cat-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vw,36px);line-height:1.1}
.cat-head .titles{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.note{display:inline-block;margin:0;background:var(--white);color:var(--red);font-weight:800;font-size:14px;padding:4px 12px;border-radius:8px}
.notes{display:flex;flex-wrap:wrap;gap:8px}
.cat-img{width:clamp(110px,24vw,190px);height:auto;flex:none}

.items{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:4px 28px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding-block:12px;border-bottom:1px solid rgba(255,255,255,.22);align-items:baseline}
.item .n{font-family:var(--f-display);font-size:22px;line-height:1.25;min-width:0}
.item .d{grid-column:1/-1;font-size:14.5px;opacity:.9;line-height:1.5;margin:0}
.price{font-family:var(--f-latin);font-size:22px;font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;gap:10px;direction:ltr}
.price small{font-family:var(--f-body);font-weight:700;font-size:11px;opacity:.85;margin-inline-start:2px}
.price .pv{display:flex;flex-direction:column;align-items:center;line-height:1}
.price .pv i{font-style:normal;font-family:var(--f-body);font-weight:700;font-size:11px;opacity:.85;margin-top:3px}
.dash{opacity:.6}

.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:22px 28px}
.group h3{margin:0 0 4px;font-family:var(--f-latin);font-weight:400;font-size:24px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.group h3 span{font-family:var(--f-display);font-size:18px;opacity:.85}
.group .item .n{font-size:19px}
.group .price{font-size:19px}

footer{padding-block:34px 40px;text-align:center}
footer .vat{display:inline-block;background:var(--white);color:var(--red);font-weight:800;padding:8px 16px;border-radius:10px;margin-bottom:14px}
footer p{margin:6px 0;opacity:.9;font-size:14px}
footer img{width:64px;margin-bottom:8px}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const price=(p,sizes)=>{
  if(Array.isArray(p)) return `<span class="price">${p.map((v,i)=>`<span class="pv">${v==null?'<span class="dash">—</span>':v}<i>${sizes[i]}</i></span>`).join("")}</span>`;
  return `<span class="price">${p}<small>ج.م</small></span>`;
};
const itemLi=(n,d,p,sizes)=>`<li class="item" data-s="${esc(n+' '+(d||''))}"><span class="n">${esc(n)}</span>${price(p,sizes)}${d?`<p class="d">${esc(d)}</p>`:""}</li>`;
let html="",nav="";
for(const c of MENU){
  nav+=`<a href="#${c.id}" data-id="${c.id}">${esc(c.ar)}</a>`;
  let body;
  if(c.groups){
    body=`<div class="groups">${c.groups.map(g=>`<div class="group"><h3>${esc(g.en)}${g.ar?`<span>${esc(g.ar)}</span>`:""}</h3><ul class="items" style="grid-template-columns:1fr">${g.items.map(([n,p])=>itemLi(n,"",p)).join("")}</ul></div>`).join("")}</div>`;
  } else {
    body=`<ul class="items">${c.items.map(([n,d,p])=>itemLi(n,d,p,c.sizes)).join("")}</ul>`;
  }
  html+=`<section class="cat" id="${c.id}"><div class="cat-head"><div class="titles"><div class="tlabel" dir="ltr"><span class="bar">${esc(c.en)}</span><span class="stem"></span></div><h2>${esc(c.ar)}</h2>${c.notes?`<div class="notes">${c.notes.map(t=>`<p class="note">${esc(t)}</p>`).join("")}</div>`:""}</div><img class="cat-img" src="${IMG[c.img]}" alt="" loading="lazy"></div>${body}</section>`;
}
document.getElementById("menu").innerHTML=html;
const navEl=document.getElementById("nav");navEl.innerHTML=nav;navEl.dir="rtl";
// active chip
const links=[...navEl.querySelectorAll("a")];
const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(a=>a.classList.toggle("on",a.dataset.id===e.target.id));const a=links.find(a=>a.dataset.id===e.target.id);if(a){const r=a.getBoundingClientRect(),n=navEl.getBoundingClientRect();navEl.scrollBy({left:(r.left+r.width/2)-(n.left+n.width/2),behavior:"auto"});}}})},{rootMargin:"-30% 0px -60% 0px"});
document.querySelectorAll("section.cat").forEach(s=>obs.observe(s));
// search
const norm=s=>s.toLowerCase().replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ");
document.getElementById("q").addEventListener("input",e=>{
  const q=norm(e.target.value.trim());let any=false;
  document.querySelectorAll("section.cat").forEach(sec=>{
    let shown=0;
    sec.querySelectorAll(".item").forEach(li=>{const ok=!q||norm(li.dataset.s).includes(q);li.hidden=!ok;if(ok)shown++;});
    sec.querySelectorAll(".group").forEach(g=>{g.hidden=!!q&&![...g.querySelectorAll(".item")].some(li=>!li.hidden)});
    sec.hidden=shown===0;if(shown)any=true;
  });
  document.getElementById("empty").hidden=any;
});
</script>
